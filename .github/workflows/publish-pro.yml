name: Publish @deslayai/ga-pubsub-pro

# Trigger: push a tag like `pro-v1.0.0`
# This workflow lives in the PRIVATE ga-pubsub-pro repo.
# GITHUB_TOKEN automatically has write access to releases in the same repo.
on:
  push:
    tags:
      - 'pro-v*'

jobs:
  publish:
    name: Build, test & release (PRO)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create GitHub Releases

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install monorepo dependencies
        run: npm ci

      - name: Run all tests
        run: npm test

      - name: Run pro package tests
        run: cd packages/pro && node ../../node_modules/vitest/vitest.mjs run --config ./vitest.config.ts

      - name: Verify license secret is configured
        run: |
          if [ -z "$GA_PUBSUB_LICENSE_SECRET" ]; then
            echo "ERROR: GA_PUBSUB_LICENSE_SECRET is not set in repository secrets"
            exit 1
          fi
          echo "License secret present (length: ${#GA_PUBSUB_LICENSE_SECRET})"
        env:
          # This is the ONE self-managed secret — a signing key you generate once.
          # Set it in: GitHub repo → Settings → Secrets → Actions → New repository secret
          # Generate a strong value with: openssl rand -hex 32
          GA_PUBSUB_LICENSE_SECRET: ${{ secrets.GA_PUBSUB_LICENSE_SECRET }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#pro-v}" >> "$GITHUB_OUTPUT"

      - name: Bump version
        run: cd packages/pro && npm version "${{ steps.version.outputs.VERSION }}" --no-git-tag-version

      - name: Build
        run: cd packages/pro && npm run build

      - name: Pack
        id: pack
        run: |
          cd packages/pro
          TARBALL=$(npm pack 2>/dev/null | tail -1)
          echo "TARBALL=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed: $TARBALL"

      # Release is on the PRIVATE repo — only collaborators with repo access can download it.
      # No paid npm plan required. Access control = GitHub repo collaborator permissions.
      - name: Create GitHub Release (private)
        uses: softprops/action-gh-release@v2
        with:
          name: "@deslayai/ga-pubsub-pro v${{ steps.version.outputs.VERSION }}"
          body: |
            ## @deslayai/ga-pubsub-pro v${{ steps.version.outputs.VERSION }}

            Commercial PRO release — for licensed customers only.
            See `packages/pro/LICENSE` for terms.

            ### Install (requires repo access)
            ```bash
            # Using a GitHub personal access token with repo scope (free GitHub account):
            npm install https://TOKEN@github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.pack.outputs.TARBALL }}

            # Or pin directly to this tag in package.json:
            # "@deslayai/ga-pubsub-pro": "github:${{ github.repository }}#pro-v${{ steps.version.outputs.VERSION }}"
            ```

            ### License key
            Obtain your license key at https://ga-pubsub.dev/pricing or contact licensing@ga-pubsub.dev
          files: packages/pro/${{ steps.pack.outputs.TARBALL }}
          token: ${{ secrets.GITHUB_TOKEN }}
