name: Deploy Demo Apps → GitHub Pages

# Demo apps are now distributed as downloadable zip files hosted on GCP.
# This workflow is intentionally disabled.
# To re-enable, uncomment the 'on:' trigger block below.

on:
  workflow_dispatch:   # Manual trigger only — kept for emergencies
  # push:
  #   branches: [main]

permissions:
  contents: write

jobs:
  deploy-notice:
    name: Demo distribution notice
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "ℹ️  GA-PubSub demo apps are distributed as downloadable zip files."
          echo "   Core demo:  https://storage.googleapis.com/deslay-ai-assets/ga-pubsub-demo.zip"
          echo "   Pro demo:   https://storage.googleapis.com/deslay-ai-assets/ga-pubsub-pro-demo.zip"
          echo ""
          echo "   Source removed from repo. See: deslay-ai.web.app/ga-pubsub/examples"
