name: Publish ga-pubsub

# Trigger: push a tag like `core-v1.0.0`
on:
  push:
    tags:
      - 'core-v*'

jobs:
  publish:
    name: Build, test & release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install monorepo dependencies
        run: npm ci

      - name: Run all tests
        run: npm test

      - name: Run core package tests
        run: cd packages/core && node ../../node_modules/vitest/vitest.mjs run --config ./vitest.config.ts

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#core-v}" >> "$GITHUB_OUTPUT"

      - name: Bump version
        run: cd packages/core && npm version "${{ steps.version.outputs.VERSION }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: cd packages/core && npm run build

      # Pack to a .tgz — customers install this directly, no npm registry needed
      - name: Pack
        id: pack
        run: |
          cd packages/core
          TARBALL=$(npm pack 2>/dev/null | tail -1)
          echo "TARBALL=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Packed: $TARBALL"

      # Publish to npm
      - name: Publish to npm
        run: cd packages/core && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Create a public GitHub Release and attach the tarball
      # Uses GITHUB_TOKEN — no extra secret required
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ga-pubsub v${{ steps.version.outputs.VERSION }}"
          body: |
            ## ga-pubsub v${{ steps.version.outputs.VERSION }}

            Free, MIT-licensed pub/sub core.

            ### Install
            ```bash
            # Option 1 — from this release (no registry needed)
            npm install https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.pack.outputs.TARBALL }}

            # Option 2 — if published to npm
            npm install ga-pubsub@${{ steps.version.outputs.VERSION }}
            ```
          files: packages/core/${{ steps.pack.outputs.TARBALL }}
          token: ${{ secrets.GITHUB_TOKEN }}
