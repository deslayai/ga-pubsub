# GA-PubSub Core Demo — self-hosted backend
# Requires: Docker + Docker Compose (both free)
#
# Usage:
#   cp .env.example .env        # fill in values
#   docker compose up -d
#
# The frontend (usage/frontend) can talk to this at http://localhost:3001

version: '3.9'

services:
  api:
    build:
      context: ../..          # monorepo root (Dockerfile needs core + backend source)
      dockerfile: usage/backend/Dockerfile
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 30s
      timeout: 5s
      retries: 3
